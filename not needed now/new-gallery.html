<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <section class="gallery-section">
        <h1>My Image Gallery</h1>

        <div class="gallery-grid">
            <img src="https://picsum.photos/500?random=1" alt="Gallery Image">
            <img src="https://picsum.photos/500?random=2" alt="Gallery Image">
            <img src="https://picsum.photos/500?random=3" alt="Gallery Image">
            <img src="https://picsum.photos/500?random=4" alt="Gallery Image">
            <img src="https://picsum.photos/500?random=5" alt="Gallery Image">
            <img src="https://picsum.photos/500?random=6" alt="Gallery Image">
            <img src="https://picsum.photos/500?random=7" alt="Gallery Image">
            <img src="https://picsum.photos/500?random=8" alt="Gallery Image">
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img class="lightbox-img" id="lightboxImg">
    </div>

    <script src="gallery.js"></script>
</body>
</html>
